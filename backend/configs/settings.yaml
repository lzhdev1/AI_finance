app:
  timezone: Asia/Shanghai
  data_dir: data
  log_dir: logs
  snapshot_dir: data/snapshots

database:
  schema: quantlab
  statement_timeout_ms: 120000

# 每日流水线的时点（Asia/Shanghai）
# 收盘前预留用户阅读时间。独立发布任务不等待模型或外部数据源。
schedule:
  premarket_news: "08:30"     # 含周末，更新新闻并生成纯研究报告
  decision_prepare: "14:45"  # 采集新闻、盘中行情和经验，形成可重新核查的预案
  intraday_decide: "14:50"   # 刷新资料，正式复核并发布一张当日指令
  decision_retry: "14:54"    # 独立发布任务核查可用方案或明确维持持仓
  decision_publish_by: "14:55" # 目标最晚可见时间；15:00 为不可逾越的交易截止
  ingest_market: "18:30"      # 收盘后：净值、板块行情、资金流全量更新
  settle: "20:30"             # 净值公布后：按真实净值确认成交 + 结算预测
  late_nav_retry: "22:30"
  morning_nav_retry: "08:10"
  score: "20:40"              # 预测打分兜底

market:
  benchmark: "000300"
  board_kinds: [industry, concept]
  news:
    lookback_days: 3
    sources: [cls, eastmoney]

backtest:
  start: "2020-01-01"
  end: null
  initial_cash: 100000
  min_trade_amount: 200

# ============================================================
# Agent 自主管理仓位的规则（这些是“事前立约”，不随行情改动）
# ============================================================
agent:
  max_pods: 5                  # 同时存活的仓上限
  min_pods: 1                  # 至少保留一个基准仓
  pod_capital: 100000          # 单仓模拟资金上限
  pod_min_eval_days: 20        # 最短考核期（交易日），不满足不许退役
  pod_hard_stop_drawdown: 0.12 # 单仓回撤超过该值立即停牌
  pod_soft_retire_hit_rate: 0.45   # 到期评估：预测命中率低于此值且跑输基准 → 退役
  pod_cooldown_days: 10        # 退役后同策略冷却期（交易日）
  open_max_board_overlap: 0.25 # 新仓与现存仓的板块重合度上限（Jaccard），超过不许开
  pod_min_interval_days: 5     # 两次开仓之间至少间隔的交易日，防止"一天一个仓"
  max_position: 0.35           # 单只基金在仓内上限
  max_board_exposure: 0.45     # 单一板块在仓内上限
  max_monthly_turnover: 0.60   # 月度换手上限
  decision_cutoff: "14:30"     # 旧策略历史回放的取证时点；在线发布使用上方 schedule
  auto_open_pod: true          # 是否允许 agent 自主开新仓

llm:
  enabled: true
  model_fast: deepseek-chat
  model_deep: deepseek-reasoner
  temperature: 0.2
  max_tokens: 4096
  timeout: 120
  json_mode: true
